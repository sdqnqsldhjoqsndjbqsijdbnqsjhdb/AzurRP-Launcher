name: Build launchers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: azurrp-windows
          - os: ubuntu-latest
            target: --linux
            artifact: azurrp-linux
          - os: macos-latest
            target: --mac
            artifact: azurrp-macos
    runs-on: ${{ matrix.os }}
    env:
      # Valeurs injectées à la compilation. Configure-les dans
      # Settings → Variables (ou Secrets) du dépôt GitHub.
      AZURRP_API_URL: ${{ vars.AZURRP_API_URL }}
      AZURRP_SERVER_HOST: ${{ vars.AZURRP_SERVER_HOST }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build && npx electron-builder ${{ matrix.target }} --publish never
      - run: npm run verify:dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.yaml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
