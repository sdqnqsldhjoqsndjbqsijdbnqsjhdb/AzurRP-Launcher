<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#110900"/>
      <stop offset=".45" stop-color="#251400"/>
      <stop offset="1" stop-color="#4a2700"/>
    </linearGradient>
    <radialGradient id="glow" cx=".74" cy=".72" r=".58">
      <stop offset="0" stop-color="#ff9720" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#ca6c00" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ca6c00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#613400"/>
      <stop offset="1" stop-color="#241300"/>
    </linearGradient>
    <linearGradient id="towerDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f2200"/>
      <stop offset="1" stop-color="#160c00"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1900"/>
      <stop offset="1" stop-color="#0c0600"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd08a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trailCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa53e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd6a7" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffa53e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="win" width="22" height="28" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="8" height="10" rx="1" fill="#ffd6a7" opacity=".6"/>
    </pattern>
    <pattern id="winAmber" width="26" height="30" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="8" height="10" rx="1" fill="#ffcf84" opacity=".55"/>
    </pattern>
    <filter id="b12"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1280" height="560" fill="url(#sky)"/>
  <rect width="1280" height="560" fill="url(#glow)"/>

  <g fill="#ffedd9">
    <circle cx="120" cy="76" r="1.6" opacity=".5"/>
    <circle cx="260" cy="140" r="1.2" opacity=".35"/>
    <circle cx="430" cy="64" r="1.8" opacity=".55"/>
    <circle cx="620" cy="120" r="1.3" opacity=".4"/>
    <circle cx="790" cy="60" r="1.6" opacity=".5"/>
    <circle cx="960" cy="132" r="1.2" opacity=".35"/>
    <circle cx="1130" cy="58" r="1.6" opacity=".45"/>
    <circle cx="1210" cy="190" r="1.3" opacity=".4"/>
  </g>

  <!-- distant skyline -->
  <g fill="url(#towerDark)" opacity=".9">
    <rect x="470" y="330" width="60" height="160"/>
    <rect x="544" y="300" width="48" height="190"/>
    <rect x="606" y="352" width="72" height="138"/>
    <rect x="692" y="286" width="54" height="204"/>
    <rect x="760" y="336" width="86" height="154"/>
    <rect x="860" y="300" width="58" height="190"/>
    <rect x="932" y="360" width="74" height="130"/>
    <rect x="1020" y="284" width="62" height="206"/>
    <rect x="1096" y="330" width="88" height="160"/>
    <rect x="1198" y="300" width="70" height="190"/>
  </g>
  <g fill="url(#win)" opacity=".32" filter="url(#b12)">
    <rect x="470" y="330" width="60" height="160"/>
    <rect x="692" y="286" width="54" height="204"/>
    <rect x="860" y="300" width="58" height="190"/>
    <rect x="1020" y="284" width="62" height="206"/>
  </g>

  <!-- main towers -->
  <g>
    <rect x="660" y="196" width="146" height="300" rx="8" fill="url(#tower)" stroke="#ffa53e" stroke-opacity=".2"/>
    <rect x="660" y="196" width="146" height="300" rx="8" fill="url(#win)" opacity=".58"/>
    <rect x="678" y="212" width="10" height="270" fill="#ffa53e" opacity=".16"/>
    <rect x="822" y="150" width="196" height="346" rx="10" fill="url(#tower)" stroke="#ffa53e" stroke-opacity=".24"/>
    <rect x="822" y="150" width="196" height="346" rx="10" fill="url(#winAmber)" opacity=".4"/>
    <rect x="844" y="168" width="12" height="314" fill="#ffd19c" opacity=".12"/>
    <rect x="900" y="168" width="12" height="314" fill="#ffa53e" opacity=".12"/>
    <rect x="1034" y="236" width="150" height="260" rx="8" fill="url(#tower)" stroke="#ffa53e" stroke-opacity=".18"/>
    <rect x="1034" y="236" width="150" height="260" rx="8" fill="url(#win)" opacity=".5"/>
    <rect x="1196" y="286" width="84" height="210" rx="6" fill="url(#tower)" stroke="#ffa53e" stroke-opacity=".14"/>
    <rect x="1196" y="286" width="84" height="210" rx="6" fill="url(#winAmber)" opacity=".36"/>
    <rect x="560" y="330" width="92" height="166" rx="6" fill="url(#towerDark)" stroke="#ffa53e" stroke-opacity=".12"/>
    <rect x="560" y="330" width="92" height="166" rx="6" fill="url(#win)" opacity=".4"/>
  </g>
  <g fill="#ffb547">
    <circle cx="920" cy="142" r="4"/>
    <circle cx="740" cy="188" r="3"/>
    <circle cx="1110" cy="228" r="3"/>
  </g>

  <!-- foreground street -->
  <path d="M0 470h1280v90H0z" fill="url(#ground)"/>
  <path d="M0 470h1280" stroke="#ffa53e" stroke-opacity=".16" stroke-width="2"/>
  <g filter="url(#b12)">
    <rect x="120" y="506" width="470" height="5" rx="3" fill="url(#trail)" opacity=".8"/>
    <rect x="640" y="530" width="580" height="5" rx="3" fill="url(#trailCyan)" opacity=".65"/>
    <rect x="360" y="548" width="420" height="4" rx="2" fill="url(#trail)" opacity=".5"/>
  </g>
  <g fill="#ffd08a" opacity=".5">
    <rect x="180" y="486" width="26" height="3" rx="2"/>
    <rect x="420" y="486" width="26" height="3" rx="2"/>
    <rect x="660" y="486" width="26" height="3" rx="2"/>
    <rect x="900" y="486" width="26" height="3" rx="2"/>
    <rect x="1140" y="486" width="26" height="3" rx="2"/>
  </g>

  <!-- left neon marker -->
  <g opacity=".55">
    <rect x="70" y="250" width="6" height="150" rx="3" fill="#ffa53e"/>
    <rect x="92" y="250" width="6" height="150" rx="3" fill="#ffa53e" opacity=".4"/>
    <rect x="70" y="250" width="28" height="4" fill="#ffa53e" opacity=".6"/>
  </g>
</svg>
