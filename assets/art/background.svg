    <rect x="980" y="1010" width="820" height="5" rx="3" fill="url(#trailCyan)" opacity=".7"/>
    <rect x="300" y="1056" width="640" height="4" rx="2" fill="url(#trail)" opacity=".55"/>
    <rect x="1180" y="1090" width="620" height="4" rx="2" fill="url(#trailCyan)" opacity=".45"/>
  </g>
  <g fill="#ffd08a" opacity=".55">
    <rect x="220" y="946" width="34" height="4" rx="2"/>
    <rect x="480" y="946" width="34" height="4" rx="2"/>
    <rect x="740" y="946" width="34" height="4" rx="2"/>
    <rect x="1000" y="946" width="34" height="4" rx="2"/>
    <rect x="1260" y="946" width="34" height="4" rx="2"/>
    <rect x="1520" y="946" width="34" height="4" rx="2"/>
    <rect x="1780" y="946" width="34" height="4" rx="2"/>
  </g>
  <rect y="1140" width="1920" height="60" fill="#0c0600" opacity=".7"/>
</svg>
