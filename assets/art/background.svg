    <rect x="854" y="596" width="76" height="204"/>
    <rect x="946" y="652" width="92" height="148"/>
    <rect x="1054" y="690" width="66" height="110"/>
    <rect x="1136" y="618" width="82" height="182"/>
    <rect x="1234" y="676" width="104" height="124"/>
    <rect x="1354" y="606" width="70" height="194"/>
    <rect x="1440" y="664" width="96" height="136"/>
    <rect x="1552" y="636" width="60" height="164"/>
    <rect x="1628" y="700" width="110" height="100"/>
    <rect x="1754" y="650" width="74" height="150"/>
    <rect x="1844" y="686" width="76" height="114"/>
  </g>
  <g fill="url(#win)" opacity=".38" filter="url(#b10)">
    <rect x="0" y="668" width="72" height="132"/>
    <rect x="86" y="624" width="54" height="176"/>
    <rect x="154" y="690" width="92" height="110"/>
    <rect x="262" y="640" width="64" height="160"/>
    <rect x="468" y="608" width="72" height="192"/>
    <rect x="660" y="620" width="58" height="180"/>
    <rect x="854" y="596" width="76" height="204"/>
    <rect x="1136" y="618" width="82" height="182"/>
    <rect x="1354" y="606" width="70" height="194"/>
    <rect x="1552" y="636" width="60" height="164"/>
    <rect x="1754" y="650" width="74" height="150"/>
