<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0" stop-color="#0e0700"/>
      <stop offset=".38" stop-color="#1f1100"/>
      <stop offset=".72" stop-color="#3a1f00"/>
      <stop offset="1" stop-color="#562e00"/>
    </linearGradient>
    <radialGradient id="glow" cx=".6" cy=".82" r=".62">
      <stop offset="0" stop-color="#ff9720" stop-opacity=".2"/>
      <stop offset=".45" stop-color="#ca6c00" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ca6c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff5ea" stop-opacity=".9"/>
      <stop offset=".22" stop-color="#ffd6a8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffd6a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c2000"/>
      <stop offset="1" stop-color="#281500"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#522c00"/>
      <stop offset="1" stop-color="#221200"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#482600"/>
      <stop offset="1" stop-color="#120a00"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#271500"/>
      <stop offset="1" stop-color="#0c0600"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd08a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trailCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa53e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd6a7" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffa53e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa53e" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffa53e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="win" width="20" height="26" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="7" height="9" rx="1" fill="#ffd6a7" opacity=".5"/>
    </pattern>
    <pattern id="winAmber" width="26" height="30" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="8" height="10" rx="1" fill="#ffcf84" opacity=".5"/>
    </pattern>
    <filter id="b24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#sky)"/>
  <rect width="1920" height="1200" fill="url(#glow)"/>

  <circle cx="1530" cy="210" r="220" fill="url(#moonGlow)" opacity=".55"/>
  <circle cx="1530" cy="210" r="58" fill="#fff3e6" opacity=".8"/>
  <g fill="#ffedd9">
    <circle cx="180" cy="150" r="2.1" opacity=".7"/>
    <circle cx="330" cy="86" r="1.6" opacity=".55"/>
    <circle cx="520" cy="196" r="1.8" opacity=".5"/>
    <circle cx="710" cy="92" r="2.4" opacity=".7"/>
    <circle cx="900" cy="170" r="1.5" opacity=".45"/>
    <circle cx="1120" cy="70" r="2" opacity=".6"/>
    <circle cx="1290" cy="150" r="1.4" opacity=".45"/>
    <circle cx="1740" cy="96" r="2.2" opacity=".65"/>
    <circle cx="1860" cy="300" r="1.5" opacity=".45"/>
    <circle cx="120" cy="330" r="1.7" opacity=".45"/>
    <circle cx="840" cy="300" r="1.4" opacity=".35"/>
  </g>

