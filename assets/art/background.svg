    <rect x="90" y="490" width="150" height="380" rx="6" fill="url(#winAmber)" opacity=".42"/>
    <rect x="254" y="556" width="120" height="314" rx="6" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".1"/>
    <rect x="254" y="556" width="120" height="314" rx="6" fill="url(#win)" opacity=".42"/>
    <rect x="388" y="430" width="188" height="440" rx="8" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".18"/>
    <rect x="388" y="430" width="188" height="440" rx="8" fill="url(#win)" opacity=".5"/>
    <rect x="404" y="446" width="10" height="410" fill="#ffa53e" opacity=".14"/>
    <rect x="590" y="566" width="140" height="304" rx="6" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".1"/>
    <rect x="590" y="566" width="140" height="304" rx="6" fill="url(#winAmber)" opacity=".36"/>
    <rect x="748" y="360" width="214" height="510" rx="10" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".2"/>
    <rect x="748" y="360" width="214" height="510" rx="10" fill="url(#win)" opacity=".55"/>
    <rect x="768" y="376" width="14" height="478" fill="#ffa53e" opacity=".16"/>
    <rect x="892" y="376" width="14" height="478" fill="#ffd19c" opacity=".09"/>
    <rect x="978" y="526" width="150" height="344" rx="6" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".12"/>
    <rect x="978" y="526" width="150" height="344" rx="6" fill="url(#win)" opacity=".42"/>
    <rect x="1144" y="444" width="192" height="426" rx="8" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".16"/>
    <rect x="1144" y="444" width="192" height="426" rx="8" fill="url(#winAmber)" opacity=".34"/>
    <rect x="1352" y="570" width="132" height="300" rx="6" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".1"/>
    <rect x="1352" y="570" width="132" height="300" rx="6" fill="url(#win)" opacity=".42"/>
    <rect x="1500" y="486" width="176" height="384" rx="8" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".14"/>
    <rect x="1500" y="486" width="176" height="384" rx="8" fill="url(#win)" opacity=".48"/>
    <rect x="1692" y="592" width="128" height="278" rx="6" fill="url(#mid)" stroke="#ffa53e" stroke-opacity=".1"/>
    <rect x="1692" y="592" width="128" height="278" rx="6" fill="url(#winAmber)" opacity=".32"/>
  </g>

  <!-- rooftop beacons -->
  <g fill="#ffb547">
    <circle cx="850" cy="352" r="4" opacity=".9"/>
    <circle cx="1240" cy="436" r="3.2" opacity=".8"/>
    <circle cx="1588" cy="478" r="3.4" opacity=".8"/>
