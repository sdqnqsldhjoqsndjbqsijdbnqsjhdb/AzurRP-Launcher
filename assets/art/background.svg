    <path d="M0 286h250v640H0z" fill="url(#win)" opacity=".3"/>
    <rect x="0" y="286" width="250" height="6" fill="#ffa53e" opacity=".25"/>
    <rect x="28" y="560" width="10" height="180" rx="5" fill="#ffa53e" opacity=".5"/>
    <rect x="46" y="560" width="10" height="180" rx="5" fill="#ffa53e" opacity=".2"/>
    <path d="M1670 210h250v716h-250z" fill="url(#near)" stroke="#ffa53e" stroke-opacity=".1"/>
    <path d="M1670 210h250v716h-250z" fill="url(#winAmber)" opacity=".26"/>
    <rect x="1670" y="210" width="250" height="6" fill="#ffb547" opacity=".3"/>
    <rect x="1848" y="470" width="10" height="220" rx="5" fill="#ffb547" opacity=".45"/>
  </g>

  <!-- wet avenue -->
  <rect y="906" width="1920" height="294" fill="url(#road)"/>
  <path d="M0 906h1920" stroke="#ffa53e" stroke-opacity=".14" stroke-width="2"/>
  <g opacity=".5">
    <rect x="120" y="906" width="120" height="220" fill="url(#reflect)"/>
    <rect x="450" y="906" width="150" height="250" fill="url(#reflect)"/>
    <rect x="820" y="906" width="180" height="270" fill="url(#reflect)"/>
