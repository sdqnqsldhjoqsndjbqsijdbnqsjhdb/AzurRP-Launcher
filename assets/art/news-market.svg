<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#100900"/>
      <stop offset=".5" stop-color="#241300"/>
      <stop offset="1" stop-color="#452500"/>
    </linearGradient>
    <radialGradient id="haze" cx=".42" cy=".7" r=".6">
      <stop offset="0" stop-color="#ffb547" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ffa53e" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffa53e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#592f00"/>
      <stop offset="1" stop-color="#1e1000"/>
    </linearGradient>
    <linearGradient id="stall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#522c00"/>
      <stop offset="1" stop-color="#1a0e00"/>
    </linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset=".5" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#e08f1f"/>
    </linearGradient>
    <linearGradient id="awningCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd6a7"/>
      <stop offset=".5" stop-color="#ffa53e"/>
      <stop offset="1" stop-color="#d27000"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1900"/>
      <stop offset="1" stop-color="#0c0600"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb547" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </linearGradient>
    <pattern id="win" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="5" y="6" width="6" height="8" rx="1" fill="#ffd6a7" opacity=".55"/>
    </pattern>
    <pattern id="winAmber" width="24" height="26" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="7" height="9" rx="1" fill="#ffcf84" opacity=".5"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>
  <rect width="640" height="360" fill="url(#haze)"/>

  <g fill="#ffedd9">
    <circle cx="84" cy="48" r="1.5" opacity=".45"/>
    <circle cx="212" cy="92" r="1.2" opacity=".3"/>
    <circle cx="352" cy="40" r="1.5" opacity=".45"/>
    <circle cx="492" cy="86" r="1.2" opacity=".3"/>
    <circle cx="588" cy="44" r="1.4" opacity=".4"/>
  </g>

  <!-- skyline -->
  <g fill="url(#tower)" opacity=".92">
    <rect x="22" y="140" width="44" height="160"/>
    <rect x="74" y="108" width="36" height="192"/>
    <rect x="118" y="156" width="52" height="144"/>
    <rect x="178" y="96" width="40" height="204"/>
    <rect x="226" y="148" width="60" height="152"/>
    <rect x="294" y="118" width="44" height="182"/>
    <rect x="346" y="160" width="54" height="140"/>
    <rect x="408" y="100" width="42" height="200"/>
    <rect x="458" y="150" width="62" height="150"/>
    <rect x="528" y="120" width="38" height="180"/>
    <rect x="574" y="156" width="48" height="144"/>
    <rect x="626" y="104" width="14" height="196"/>
  </g>
  <g fill="url(#win)" opacity=".34" filter="url(#glow)">
    <rect x="74" y="108" width="36" height="192"/>
    <rect x="178" y="96" width="40" height="204"/>
    <rect x="294" y="118" width="44" height="182"/>
    <rect x="408" y="100" width="42" height="200"/>
    <rect x="528" y="120" width="38" height="180"/>
  </g>

  <!-- string lights -->
  <path d="M0 96c96 34 158 8 240 34s146 14 240-18 118-6 160 2" fill="none" stroke="#ffb547" stroke-opacity=".35" stroke-width="1.4"/>
  <g fill="#ffd08a" filter="url(#glow)">
    <circle cx="56" cy="106" r="3"/>
    <circle cx="128" cy="112" r="2.6"/>
    <circle cx="208" cy="126" r="2.6"/>
    <circle cx="288" cy="134" r="2.8"/>
    <circle cx="368" cy="128" r="2.6"/>
    <circle cx="452" cy="112" r="2.8"/>
    <circle cx="536" cy="102" r="2.6"/>
    <circle cx="612" cy="100" r="2.6"/>
  </g>

  <!-- food trucks / night market stalls -->
  <g>
    <rect x="70" y="196" width="128" height="86" rx="8" fill="url(#stall)" stroke="#ffa53e" stroke-opacity=".22"/>
    <rect x="70" y="188" width="128" height="12" rx="6" fill="url(#awningCyan)"/>
    <rect x="84" y="214" width="52" height="30" rx="4" fill="#1e1000" stroke="#ffa53e" stroke-opacity=".35"/>
    <rect x="84" y="214" width="52" height="30" rx="4" fill="#ffa53e" opacity=".12"/>
    <rect x="146" y="216" width="40" height="6" rx="3" fill="#ffd08a" opacity=".55"/>
    <rect x="146" y="230" width="30" height="5" rx="2.5" fill="#ffd6a7" opacity=".4"/>
    <circle cx="96" cy="288" r="9" fill="#0b0600" stroke="#ffa53e" stroke-opacity=".2"/>
    <circle cx="172" cy="288" r="9" fill="#0b0600" stroke="#ffa53e" stroke-opacity=".2"/>
  </g>

  <g>
    <rect x="236" y="204" width="150" height="78" rx="8" fill="url(#stall)" stroke="#ffa53e" stroke-opacity=".18"/>
    <rect x="236" y="196" width="150" height="12" rx="6" fill="url(#awning)"/>
    <g fill="#0b0600" opacity=".55">
      <rect x="252" y="224" width="34" height="24" rx="3"/>
      <rect x="296" y="224" width="34" height="24" rx="3"/>
      <rect x="340" y="224" width="34" height="24" rx="3"/>
    </g>
    <g fill="#ffa53e" opacity=".5">
      <rect x="258" y="230" width="22" height="3" rx="1.5"/>
      <rect x="302" y="230" width="22" height="3" rx="1.5"/>
      <rect x="346" y="230" width="22" height="3" rx="1.5"/>
    </g>
  </g>

  <g>
    <rect x="436" y="200" width="132" height="82" rx="8" fill="url(#stall)" stroke="#ffa53e" stroke-opacity=".2"/>
    <rect x="436" y="192" width="132" height="12" rx="6" fill="url(#awningCyan)"/>
    <rect x="450" y="218" width="46" height="34" rx="4" fill="#1e1000" stroke="#ffb547" stroke-opacity=".3"/>
    <rect x="450" y="218" width="46" height="34" rx="4" fill="#ffb547" opacity=".1"/>
    <g fill="#ffd08a" opacity=".6">
      <rect x="508" y="220" width="46" height="4" rx="2"/>
      <rect x="508" y="232" width="34" height="4" rx="2"/>
      <rect x="508" y="244" width="40" height="4" rx="2"/>
    </g>
    <circle cx="462" cy="288" r="9" fill="#0b0600" stroke="#ffa53e" stroke-opacity=".18"/>
    <circle cx="542" cy="288" r="9" fill="#0b0600" stroke="#ffa53e" stroke-opacity=".18"/>
  </g>

  <!-- crowd silhouettes -->
  <g fill="#0b0600">
    <path d="M12 322c0-15 9-26 21-26s21 11 21 26v38H12z"/>
    <path d="M50 330c0-11 7-20 16-20s16 9 16 20v30H50z"/>
    <path d="M192 320c0-13 8-23 19-23s19 10 19 23v40h-38z"/>
    <path d="M226 330c0-11 7-20 16-20s16 9 16 20v30h-32z"/>
    <path d="M396 324c0-13 8-23 19-23s19 10 19 23v36h-38z"/>
    <path d="M430 332c0-10 6-18 15-18s15 8 15 18v28h-30z"/>
    <path d="M568 318c0-15 9-26 22-26s22 11 22 26v42h-44z"/>
    <path d="M606 328c0-12 7-21 17-21s17 9 17 21v32h-34z"/>
  </g>

  <rect y="300" width="640" height="60" fill="url(#ground)"/>
  <g opacity=".7">
    <rect x="92" y="300" width="86" height="52" fill="url(#reflect)"/>
    <rect x="258" y="300" width="104" height="56" fill="url(#reflect)"/>
    <rect x="454" y="300" width="96" height="54" fill="url(#reflect)"/>
  </g>
  <g fill="#ffd08a" opacity=".45">
    <rect x="120" y="330" width="24" height="3" rx="2"/>
    <rect x="300" y="340" width="20" height="3" rx="2"/>
    <rect x="480" y="334" width="22" height="3" rx="2"/>
  </g>
</svg>
