<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <!-- Steve's classic 8x8 face, each pixel is 16x16 px -->
  <rect width="128" height="128" fill="#9B6748"/>
  <!-- Hair -->
  <path fill="#493126" d="M0 0h128v32H0z M0 32h16v16H0z M112 32h16v16h-16z"/>
  <path fill="#62412F" d="M16 16h96v16H16z M16 32h16v16H16z M96 32h16v16H96z"/>
  <!-- Face shading -->
  <path fill="#B77D58" d="M16 48h96v48H16z M32 96h64v16H32z"/>
  <path fill="#8B583F" d="M0 64h16v32H0z M112 64h16v32h-16z M16 112h96v16H16z"/>
  <!-- Eyes -->
  <rect x="16" y="64" width="32" height="16" fill="#FFFFFF"/>
  <rect x="80" y="64" width="32" height="16" fill="#FFFFFF"/>
  <rect x="32" y="64" width="16" height="16" fill="#3C78A8"/>
  <rect x="80" y="64" width="16" height="16" fill="#3C78A8"/>
  <rect x="32" y="64" width="8" height="16" fill="#263E58"/>
  <rect x="80" y="64" width="8" height="16" fill="#263E58"/>
  <!-- Nose -->
  <rect x="48" y="80" width="32" height="16" fill="#A96D4D"/>
  <!-- Mouth and beard -->
  <path fill="#493126" d="M32 96h64v16H32z M48 112h32v16H48z"/>
  <path fill="#68432F" d="M32 96h16v16H32z M80 96h16v16H80z"/>
  <rect x="48" y="96" width="32" height="16" fill="#754B35"/>
</svg>
